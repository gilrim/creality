[prtouch_v3]
serial: installer will set
swap_pin: installer will set
channel_pins: installer will set
# z_offset (default 0.0) lives in the SAVE_CONFIG block via Z_OFFSET_APPLY_PROBE;
# setting it here makes SAVE_CONFIG refuse the include conflict.
coarse_step: 0.05
fine_step: 0.01
trigger_force: 10000
fit_min_force: 2000
force_safety_limit: 300000
max_travel: 3.0
# Initial acceptance limits; validate with clean-nozzle accuracy runs.
min_stiffness: 50
max_stiffness: 1500
max_fit_error: 0.005
max_extrapolation: 0.1


# Needs an existing Z_OFFSET_APPLY_PROBE (cartographer/beacon/[probe] register one); remove
# this macro on a machine without one, or klippy refuses the rename.
[gcode_macro Z_OFFSET_APPLY_PROBE]
rename_existing: _Z_OFFSET_APPLY_PROBE
gcode:
    PRTOUCH_Z_OFFSET_APPLY_PROBE


[gcode_macro _LOAD_CELL_HOME_Z]
# z is already homed by the main probe (eg cartographer scan); start the load
# cell approach this far above the bed so it only has to step a short way
variable_approach_z: 1.0
gcode:
    {% set preheat_nozzle_temp = printer["gcode_macro _START_END_PARAMS"].start_preheat_nozzle_temp %}
    M109 S{preheat_nozzle_temp} # wait for nozzle temp

    # flag that tap phase is starting, so a failed tap keeps the heaters and motors on
    _START_PRINT_TOUCH_STATE BED_TARGET={printer.heater_bed.target} EXTRUDER_TARGET={preheat_nozzle_temp}
    SET_GCODE_VARIABLE MACRO=_START_PRINT_TOUCH_STATE VARIABLE=touch_started VALUE=True

    G90
    G0 Z10 F900
    {% set pos = printer.configfile.settings.bed_mesh.zero_reference_position %}
    G1 X{pos[0]} Y{pos[1]} F6000
    G0 Z{approach_z} F900
    PRTOUCH_PROBE HOME=Z
    G0 Z8 F900

    # flag that tap phase is ending
    SET_GCODE_VARIABLE MACRO=_START_PRINT_TOUCH_STATE VARIABLE=touch_started VALUE=False


[gcode_macro PRTOUCH_PROBE_ACCURACY]
rename_existing: _PRTOUCH_PROBE_ACCURACY
description: Probe nozzle contact several times at the zero reference position
gcode:
    {% set approach_z = printer["gcode_macro _LOAD_CELL_HOME_Z"].approach_z %}
    G90
    G0 Z10 F900
    {% set pos = printer.configfile.settings.bed_mesh.zero_reference_position %}
    G1 X{pos[0]} Y{pos[1]} F6000
    G0 Z{approach_z} F900
    _PRTOUCH_PROBE_ACCURACY {rawparams}
    G0 Z8 F900
